[package]
name = "vocal_clean"
version = "0.1.0"
edition = "2021"
authors = ["Mahadev Joshi"]
description = "AI vocal noise reduction CLAP plugin for Linux, powered by DeepFilterNet3"
license = "MIT OR Apache-2.0"

[lib]
name = "vocal_clean"
crate-type = ["cdylib", "rlib"]

[dependencies]
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", default-features = false }
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet.git", default-features = false, features = ["tract", "default-model"] }
ndarray = "0.15"
rubato = "0.14"
log = "0.4"
# DeepFilterNet was written against tract 0.21.4; newer 0.21.x releases changed the API.
tract-core = "=0.21.4"
tract-onnx = "=0.21.4"
tract-pulse = "=0.21.4"
tract-hir = "=0.21.4"

[dev-dependencies]
hound = "3.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false

[profile.dev]
opt-level = 2
